<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Diamond Pass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0818;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    width: 300px;
    height: 480px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Diamond-shaped frame/platform underneath */
  .diamond-platform {
    position: absolute;
    width: 260px;
    height: 260px;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }

  .diamond-platform svg {
    width: 100%;
    height: 100%;
    animation: platformPulse 3s ease-in-out infinite;
  }

  @keyframes platformPulse {
    0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 8px rgba(100,160,255,0.3)); }
    50% { opacity: 0.8; filter: drop-shadow(0 0 18px rgba(100,160,255,0.6)); }
  }

  /* Main floating group */
  .float-group {
    position: absolute;
    width: 220px;
    height: 320px;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    animation: floatBob 3s ease-in-out infinite;
  }

  @keyframes floatBob {
    0%, 100% { transform: translateX(-50%) translateY(0px); }
    50% { transform: translateX(-50%) translateY(-14px); }
  }

  /* ---- BOOK STACK ---- */
  .book-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 220px;
  }

  .page {
    position: absolute;
    width: 150px;
    height: 190px;
    border-radius: 8px;
    left: 50%;
  }

  .page-4 {
    transform: translateX(-50%) rotate(-12deg) translateY(16px);
    background: linear-gradient(145deg, #1a0840, #120530);
    border: 1px solid rgba(80,40,160,0.4);
    box-shadow: -6px 6px 20px rgba(0,0,0,0.7);
    z-index: 1;
  }

  .page-3 {
    transform: translateX(-50%) rotate(-7deg) translateY(10px);
    background: linear-gradient(145deg, #220a50, #160638);
    border: 1px solid rgba(90,50,170,0.5);
    box-shadow: -4px 5px 16px rgba(0,0,0,0.6);
    z-index: 2;
  }

  .page-2 {
    transform: translateX(-50%) rotate(-3deg) translateY(4px);
    background: linear-gradient(145deg, #2e1068, #1e0848);
    border: 1px solid rgba(110,60,190,0.6);
    box-shadow: -3px 4px 12px rgba(0,0,0,0.5);
    z-index: 3;
  }

  .page-1 {
    transform: translateX(-50%) rotate(0deg);
    background: linear-gradient(145deg, #4a1aaa 0%, #30108a 30%, #1e0868 60%, #3a14a0 100%);
    border: 1.5px solid rgba(140,90,255,0.7);
    box-shadow:
      0 6px 30px rgba(70,20,180,0.7),
      0 0 60px rgba(80,30,200,0.3),
      inset 0 0 40px rgba(80,40,180,0.2);
    z-index: 4;
    overflow: hidden;
  }

  .page-1::before {
    content: '';
    position: absolute;
    top: -100%;
    left: -60%;
    width: 40%;
    height: 300%;
    background: linear-gradient(
      105deg,
      transparent 30%,
      rgba(255,255,255,0.18) 50%,
      transparent 70%
    );
    animation: shineSweep 3s ease-in-out infinite;
    z-index: 5;
  }

  @keyframes shineSweep {
    0% { left: -60%; }
    40%, 100% { left: 160%; }
  }

  .week-spine {
    position: absolute;
    right: -2px;
    top: 0;
    bottom: 0;
    width: 36px;
    background: linear-gradient(180deg, #5a22bb, #2a0e70);
    border-left: 1px solid rgba(160,100,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .week-spine span {
    font-family: Arial Black, sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    color: rgba(200,170,255,0.5);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
  }

  /* ---- CENTER DIAMOND ---- */
  .center-diamond {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    z-index: 10;
    animation: diamondGlow 2s ease-in-out infinite;
  }

  @keyframes diamondGlow {
    0%, 100% {
      filter: drop-shadow(0 0 10px #60a8ff) drop-shadow(0 0 30px #3070e0) drop-shadow(0 0 60px rgba(50,100,220,0.4));
    }
    50% {
      filter: drop-shadow(0 0 20px #90ccff) drop-shadow(0 0 50px #5090f0) drop-shadow(0 0 90px rgba(70,130,240,0.6));
    }
  }

  /* ---- FLOATING GEM PARTICLES ---- */
  .gems-layer {
    position: absolute;
    inset: -40px;
    z-index: 8;
    pointer-events: none;
  }

  .gem {
    position: absolute;
    animation: gemSpark var(--dur) ease-in-out var(--del) infinite;
    opacity: 0;
  }

  @keyframes gemSpark {
    0%   { opacity: 0; transform: translate(0,0) scale(0.5) rotate(var(--r0)); }
    20%  { opacity: 1; transform: translate(var(--tx1), var(--ty1)) scale(1) rotate(var(--r1)); }
    50%  { opacity: 0.9; transform: translate(var(--tx2), var(--ty2)) scale(1.1) rotate(var(--r2)); }
    80%  { opacity: 0.6; transform: translate(var(--tx3), var(--ty3)) scale(0.8) rotate(var(--r3)); }
    100% { opacity: 0; transform: translate(var(--tx4), var(--ty4)) scale(0.3) rotate(var(--r4)); }
  }

  .sparkle {
    position: absolute;
    animation: sparkleFade var(--dur) ease-in-out var(--del) infinite;
    opacity: 0;
  }

  @keyframes sparkleFade {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    30%, 70% { opacity: 1; transform: scale(1) rotate(45deg); }
  }
</style>
</head>
<body>

<div class="scene">

  <div class="diamond-platform">
    <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#5080c0;stop-opacity:0.6"/>
          <stop offset="100%" style="stop-color:#2040a0;stop-opacity:0.1"/>
        </linearGradient>
      </defs>
      <polygon points="130,8 252,130 130,252 8,130"
        fill="none" stroke="rgba(100,160,255,0.35)" stroke-width="1.5"/>
      <polygon points="130,40 222,130 130,220 38,130"
        fill="url(#platGrad)" stroke="rgba(120,180,255,0.2)" stroke-width="1"/>
      <circle cx="130" cy="8" r="3" fill="#70b0ff" opacity="0.7"/>
      <circle cx="252" cy="130" r="3" fill="#70b0ff" opacity="0.7"/>
      <circle cx="130" cy="252" r="3" fill="#70b0ff" opacity="0.7"/>
      <circle cx="8" cy="130" r="3" fill="#70b0ff" opacity="0.7"/>
    </svg>
  </div>

  <div class="float-group">

    <div class="book-wrap">
      <div class="page page-4"></div>
      <div class="page page-3"></div>
      <div class="page page-2"></div>
      <div class="page page-1">
        <div class="week-spine"><span>PASSES &amp; BUNDLES</span></div>
      </div>
    </div>

    <div class="center-diamond">
      <svg viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dMain" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" style="stop-color:#d0eeff"/>
            <stop offset="25%" style="stop-color:#90ccff"/>
            <stop offset="60%" style="stop-color:#4888e8"/>
            <stop offset="100%" style="stop-color:#1a40a0"/>
          </linearGradient>
          <linearGradient id="dFacet" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
            <stop offset="100%" style="stop-color:#6090cc;stop-opacity:0.1"/>
          </linearGradient>
          <filter id="dGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <polygon points="55,5 103,46 55,105 7,46" fill="url(#dMain)" filter="url(#dGlow)"/>
        <polygon points="55,5 103,46 55,50 7,46" fill="url(#dFacet)"/>
        <polygon points="55,5 7,46 55,50" fill="rgba(255,255,255,0.2)"/>
        <polygon points="55,5 103,46 55,50" fill="rgba(200,230,255,0.15)"/>
        <polygon points="7,46 55,50 55,105" fill="rgba(10,30,100,0.4)"/>
        <polygon points="103,46 55,50 55,105" fill="rgba(5,20,80,0.5)"/>
        <ellipse cx="43" cy="30" rx="14" ry="8" fill="rgba(255,255,255,0.35)" transform="rotate(-20,43,30)"/>
        <polygon points="55,8 70,28 55,32 40,28" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>

    <div class="gems-layer">

      <div class="gem" style="top:60px;left:10px;--dur:2.8s;--del:0s;--r0:10deg;--tx1:-8px;--ty1:-15px;--tx2:-12px;--ty2:-8px;--tx3:-6px;--ty3:5px;--tx4:0px;--ty4:10px;--r1:30deg;--r2:60deg;--r3:80deg;--r4:100deg;">
        <svg width="22" height="22" viewBox="0 0 20 20"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#b0dcff"/><stop offset="100%" style="stop-color:#4488dd"/></linearGradient></defs><polygon points="10,1 18,8 10,19 2,8" fill="url(#g1)"/><polygon points="10,1 14,6 10,8 6,6" fill="rgba(255,255,255,0.5)"/></svg>
      </div>

      <div class="gem" style="top:40px;right:5px;--dur:3.2s;--del:0.6s;--r0:-10deg;--tx1:10px;--ty1:-12px;--tx2:14px;--ty2:-5px;--tx3:8px;--ty3:6px;--tx4:0px;--ty4:12px;--r1:-25deg;--r2:-50deg;--r3:-70deg;--r4:-90deg;">
        <svg width="20" height="20" viewBox="0 0 20 20"><defs><linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#c0e4ff"/><stop offset="100%" style="stop-color:#5090e0"/></linearGradient></defs><polygon points="10,1 18,8 10,19 2,8" fill="url(#g2)"/><polygon points="10,1 14,6 10,8 6,6" fill="rgba(255,255,255,0.5)"/></svg>
      </div>

      <div class="gem" style="top:130px;left:0px;--dur:2.5s;--del:1.1s;--r0:5deg;--tx1:-14px;--ty1:-6px;--tx2:-16px;--ty2:4px;--tx3:-8px;--ty3:10px;--tx4:0px;--ty4:6px;--r1:20deg;--r2:40deg;--r3:55deg;--r4:70deg;">
        <svg width="26" height="26" viewBox="0 0 20 20"><defs><linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a0d8ff"/><stop offset="100%" style="stop-color:#3878d8"/></linearGradient></defs><polygon points="10,1 18,8 10,19 2,8" fill="url(#g3)"/><polygon points="10,1 14,6 10,8 6,6" fill="rgba(255,255,255,0.45)"/></svg>
      </div>

      <div class="gem" style="top:120px;right:2px;--dur:3.6s;--del:0.3s;--r0:-5deg;--tx1:12px;--ty1:-8px;--tx2:15px;--ty2:2px;--tx3:9px;--ty3:12px;--tx4:0px;--ty4:8px;--r1:-18deg;--r2:-35deg;--r3:-50deg;--r4:-65deg;">
        <svg width="18" height="18" viewBox="0 0 20 20"><defs><linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#b8e0ff"/><stop offset="100%" style="stop-color:#5088e0"/></linearGradient></defs><polygon points="10,1 18,8 10,19 2,8" fill="url(#g4)"/><polygon points="10,1 14,6 10,8 6,6" fill="rgba(255,255,255,0.45)"/></svg>
      </div>

      <div class="gem" style="top:20px;left:50px;--dur:2.2s;--del:0.8s;--r0:0deg;--tx1:-4px;--ty1:-18px;--tx2:2px;--ty2:-22px;--tx3:6px;--ty3:-10px;--tx4:0px;--ty4:0px;--r1:40deg;--r2:80deg;--r3:100deg;--r4:130deg;">
        <svg width="12" height="12" viewBox="0 0 20 20"><polygon points="10,1 18,8 10,19 2,8" fill="#90c8ff" opacity="0.9"/></svg>
      </div>

      <div class="gem" style="top:20px;right:45px;--dur:2.6s;--del:1.4s;--r0:0deg;--tx1:6px;--ty1:-16px;--tx2:0px;--ty2:-20px;--tx3:-4px;--ty3:-8px;--tx4:0px;--ty4:0px;--r1:-35deg;--r2:-70deg;--r3:-90deg;--r4:-120deg;">
        <svg width="10" height="10" viewBox="0 0 20 20"><polygon points="10,1 18,8 10,19 2,8" fill="#a0d0ff" opacity="0.85"/></svg>
      </div>

      <div class="gem" style="top:175px;left:30px;--dur:3s;--del:0.5s;--r0:0deg;--tx1:-10px;--ty1:8px;--tx2:-6px;--ty2:14px;--tx3:0px;--ty3:10px;--tx4:0px;--ty4:0px;--r1:25deg;--r2:50deg;--r3:70deg;--r4:90deg;">
        <svg width="14" height="14" viewBox="0 0 20 20"><polygon points="10,1 18,8 10,19 2,8" fill="#78b8ff" opacity="0.85"/></svg>
      </div>

      <div class="gem" style="top:175px;right:28px;--dur:2.9s;--del:1.7s;--r0:0deg;--tx1:10px;--ty1:10px;--tx2:6px;--ty2:15px;--tx3:0px;--ty3:10px;--tx4:0px;--ty4:0px;--r1:-22deg;--r2:-44deg;--r3:-60deg;--r4:-80deg;">
        <svg width="13" height="13" viewBox="0 0 20 20"><polygon points="10,1 18,8 10,19 2,8" fill="#88c4ff" opacity="0.8"/></svg>
      </div>

      <!-- Sparkles -->
      <div class="sparkle" style="top:8px;left:70px;--dur:1.8s;--del:0.2s;">
        <svg width="14" height="14" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="white" opacity="0.9"/></svg>
      </div>
      <div class="sparkle" style="top:8px;right:60px;--dur:2s;--del:1s;">
        <svg width="10" height="10" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="white" opacity="0.8"/></svg>
      </div>
      <div class="sparkle" style="top:90px;left:4px;--dur:2.4s;--del:0.5s;">
        <svg width="12" height="12" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="#c0e0ff" opacity="0.9"/></svg>
      </div>
      <div class="sparkle" style="top:90px;right:2px;--dur:2.1s;--del:1.3s;">
        <svg width="11" height="11" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="#d0eaff" opacity="0.85"/></svg>
      </div>
      <div class="sparkle" style="top:200px;left:55px;--dur:2.3s;--del:0.9s;">
        <svg width="9" height="9" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="white" opacity="0.75"/></svg>
      </div>
      <div class="sparkle" style="top:200px;right:50px;--dur:1.9s;--del:1.6s;">
        <svg width="11" height="11" viewBox="0 0 20 20"><path d="M10,1 L11.5,8.5 L19,10 L11.5,11.5 L10,19 L8.5,11.5 L1,10 L8.5,8.5 Z" fill="white" opacity="0.8"/></svg>
      </div>

    </div>

  </div>

</div>

</body>
</html>
